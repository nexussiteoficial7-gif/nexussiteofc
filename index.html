<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexus</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="background-animation"></div>

<header>
    <h1 class="logo">NEXUS</h1>
    <input type="text" id="search" placeholder="Pesquisar produto...">
</header>

<section class="products">

<div class="card" data-name="internal">
    <img src="assets/internal.png">
    <h3>Nexus Internal</h3>
    <p>Painel premium desenvolvido com arquitetura interna otimizada.</p>
</div>

<div class="card" data-name="external">
    <img src="assets/external.png">
    <h3>Nexus External</h3>
    <p>Versão eficiente com excelente desempenho.</p>
</div>

<div class="card" data-name="trick">
    <img src="assets/trick.png">
    <h3>Nexus Trick</h3>
    <p>Configurações avançadas com precisão refinada.</p>
</div>

<div class="card" data-name="ios">
    <img src="assets/ios.png">
    <h3>Nexus iOS</h3>
    <p>Solução otimizada para dispositivos iOS.</p>
</div>

</section>

<script src="script.js"></script>
</body>
</html>
